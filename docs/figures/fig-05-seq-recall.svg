  <path d="M50 94 V520" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="128" y="24" width="94" height="34" rx="6"/>
  <path d="M175 58 V520" stroke-dasharray="3 6" stroke-width="1"/>
  <rect x="261" y="24" width="138" height="34" rx="6"/>
