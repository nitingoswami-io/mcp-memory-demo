<g fill="currentColor" stroke="none">
  <text x="50" y="86" text-anchor="middle">You</text>
  <text x="175" y="45" text-anchor="middle">MCP client</text>
  <text x="330" y="45" text-anchor="middle">server.py remember</text>
  <text x="500" y="45" text-anchor="middle">MemoryStore.add</text>
  <text x="680" y="45" text-anchor="middle">Chroma collection</text>
  <text x="870" y="45" text-anchor="middle">MiniLM (ONNX)</text>
  <rect class="sk-bg" x="-22" y="97" width="269" height="17" rx="3"/>
  <text x="112.5" y="109" text-anchor="middle" font-size="12">1  “Remember I’m allergic to shellfish”</text>
  <rect class="sk-bg" x="121" y="127" width="263" height="17" rx="3"/>
  <text x="252.5" y="139" text-anchor="middle" font-size="12">2  tools/call remember {content, tags}</text>
  <rect class="sk-bg" x="314" y="157" width="202" height="17" rx="3"/>
  <text x="415" y="169" text-anchor="middle" font-size="12">3  add(content, tags, source)</text>
  <rect class="sk-bg" x="530" y="198" width="296" height="17" rx="3"/>
  <text x="534" y="210" text-anchor="start" font-size="12">4  uuid4 hex, created_at (UTC), tags joined</text>
  <rect class="sk-bg" x="475.5" y="217" width="229" height="17" rx="3"/>
  <text x="590" y="229" text-anchor="middle" font-size="12" class="sk-accent">5  add(ids, documents, metadatas)</text>
  <rect class="sk-bg" x="714" y="247" width="122" height="17" rx="3"/>
  <text x="775" y="259" text-anchor="middle" font-size="12" class="sk-accent">6  embed document</text>
  <rect class="sk-bg" x="714" y="277" width="122" height="17" rx="3"/>
  <text x="775" y="289" text-anchor="middle" font-size="12" class="sk-accent">7  384-dim vector</text>
  <rect class="sk-bg" x="710" y="318" width="176" height="17" rx="3"/>
  <text x="714" y="330" text-anchor="start" font-size="12" class="sk-accent">8  write to ./data/chroma</text>
  <rect class="sk-bg" x="569" y="337" width="42" height="17" rx="3"/>
  <text x="590" y="349" text-anchor="middle" font-size="12">9  ok</text>
  <rect class="sk-bg" x="367.5" y="367" width="95" height="17" rx="3"/>
  <text x="415" y="379" text-anchor="middle" font-size="12">10  memory id</text>
  <rect class="sk-bg" x="161.5" y="397" width="182" height="17" rx="3"/>
  <text x="252.5" y="409" text-anchor="middle" font-size="12">11  {id, status: "stored"}</text>
  <rect class="sk-bg" x="65" y="427" width="95" height="17" rx="3"/>
  <text x="112.5" y="439" text-anchor="middle" font-size="12">12  “Got it.”</text>
</g>
</svg>
