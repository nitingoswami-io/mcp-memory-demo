  <path d="M82 168 L200 190"/>
  <ellipse cx="320" cy="250" rx="120" ry="22"/>
  <path d="M82 168 L200 250"/>
  <ellipse cx="320" cy="310" rx="120" ry="22"/>
  <path d="M82 168 L200 310"/>
  <rect x="600" y="130" width="160" height="56" rx="6"/>
  <rect x="604" y="134" width="152" height="48" rx="3"/>
  <path d="M440 70 L600 146" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M440 130 L600 166" class="sk-accent" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>
</g>
<g fill="currentColor" stroke="none">
  <text x="60" y="200" text-anchor="middle">You, via an</text>
  <text x="60" y="216" text-anchor="middle">MCP client</text>
  <text x="162" y="40" text-anchor="start" font-size="12" font-weight="700">personal-memory MCP server</text>
  <text x="320" y="74" text-anchor="middle">Remember a fact</text>
  <text x="320" y="134" text-anchor="middle" class="sk-accent">Recall by meaning</text>
  <text x="320" y="194" text-anchor="middle">List recent memories</text>
  <text x="320" y="254" text-anchor="middle">Forget a memory</text>
  <text x="320" y="314" text-anchor="middle">Read store stats</text>
  <text x="680" y="156" text-anchor="middle">all-MiniLM-L6-v2</text>
