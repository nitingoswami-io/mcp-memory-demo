name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python -m compileall -q server.py memory_store.py seed.py test_server.py
      # No API keys needed: embeddings run locally (MiniLM via ONNX).
      - run: uv run pytest -q
